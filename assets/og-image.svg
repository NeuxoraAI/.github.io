  <style>
    .eyebrow  { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 24px; fill: #5e5d59; }
    .wordmark { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-weight: 600; font-size: 136px; letter-spacing: -4px; fill: #141413; }
    .tagline  { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 32px; fill: #5e5d59; }
    .meta     { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #141413; }
